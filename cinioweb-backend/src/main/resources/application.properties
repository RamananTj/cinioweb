spring.application.name=cinioweb-backend

spring.datasource.url=jdbc:mysql://localhost:3306/cinioweb
spring.datasource.username=root
spring.datasource.password=Mymysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Amazon Bedrock - custom properties for cinioweb
bedrock.api-key=${AWS_BEARER_TOKEN_BEDROCK}
bedrock.region =ap-southeast-2
bedrock.model-id=amazon.nova-micro-v1:0

# Open router - using Spring AI
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=openrouter/free
spring.ai.openai.chat.options.temperature=0.2

# AI Provider Selection
storybeat.provider=openrouter

spring.ai.chat.client.enabled=false

# Image Generation ai model
pollinations.base-url=https://gen.pollinations.ai
pollinations.api-key=${POLLINATIONS_API_KEY}
pollinations.image-model=black-forest-labs/flux.1-schnell

# Local development storage
cinioweb.upload-dir=uploads
